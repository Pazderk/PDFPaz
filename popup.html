<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PDFPaz</title>
<style>
  :root {
    --bg: #1e1f22;
    --panel: #26282c;
    --panel-2: #2e3136;
    --border: #3a3d42;
    --text: #e8e9eb;
    --text-dim: #9a9ea5;
    --accent: #4f8cff;
    --accent-hover: #6fa1ff;
    --danger: #e5484d;
    --danger-hover: #ff6167;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 480px;
    max-height: 600px;
    overflow-y: auto;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
  }
  header {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 15px;
    margin: 0 0 2px;
    font-weight: 600;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 11.5px;
  }
  #dropZone {
    margin: 12px 14px;
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 22px 12px;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #dropZone.dragover {
    border-color: var(--accent);
    background: rgba(79,140,255,0.08);
    color: var(--text);
  }
  #dropZone strong { color: var(--text); }
  #fileInput { display: none; }

  #docInfo {
    margin: 0 14px 10px;
    color: var(--text-dim);
    font-size: 11.5px;
    display: none;
  }

  #toolbar {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 14px 10px;
    border-bottom: 1px solid var(--border);
  }
  .btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    line-height: 1.3;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: #fff; }

  select.angle {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
  }

  #status {
    padding: 6px 14px;
    font-size: 11.5px;
    color: var(--text-dim);
    min-height: 16px;
  }
  #status.error { color: var(--danger); }

  #thumbnailGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 10px 14px 16px;
  }
  .thumb-card {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 6px 6px 4px;
    cursor: pointer;
    text-align: center;
    user-select: none;
    transition: border-color .1s, opacity .1s;
  }
  .thumb-card:hover { border-color: var(--accent); }
  .thumb-card canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    background: #fff;
    border-radius: 2px;
    transition: transform .15s;
  }
  .thumb-card .page-label {
    margin-top: 4px;
    font-size: 10.5px;
    color: var(--text-dim);
  }
  .thumb-card.deleted {
    opacity: .35;
    border-color: var(--danger);
  }
  .thumb-card.deleted::after {
    content: "REMOVED";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-12deg);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--danger);
    border: 1.5px solid var(--danger);
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(30,31,34,0.7);
  }
  .thumb-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .select-check {
    position: absolute;
    top: 4px;
    left: 4px;
    z-index: 2;
    width: 16px;
    height: 16px;
  }
  .select-check input {
    width: 14px;
    height: 14px;
    cursor: pointer;
  }
  .rot-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    background: var(--accent);
    color: #fff;
    font-size: 9px;
    font-weight: 600;
    padding: 1px 4px;
    border-radius: 8px;
    display: none;
  }

  #emptyState {
    padding: 30px 14px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
  }

  footer {
    padding: 8px 14px 12px;
    color: var(--text-dim);
    font-size: 10.5px;
    text-align: center;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
  <header>
    <h1>PDFPaz</h1>
    <p>Local PDF editor &mdash; everything stays on this device.</p>
  </header>

  <div id="dropZone">
    <div><strong>Click to choose a PDF</strong> or drag &amp; drop it here</div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" />
  </div>

  <div id="docInfo"></div>

  <div id="toolbar">
    <button class="btn primary" id="btnExport" title="Export a PDF with removed pages and rotations applied">Export PDF</button>
    <button class="btn" id="btnSplit" title="Split every active page into its own PDF file">Split into Pages</button>
    <button class="btn" id="btnExtractText" title="Extract all text to a .txt file">Extract Text</button>
    <button class="btn" id="btnExtractImages" title="Extract embedded raster images as PNGs">Extract Images</button>
    <select class="angle" id="rotateAngle" title="Rotation angle">
      <option value="90">Rotate 90&deg;</option>
      <option value="180">Rotate 180&deg;</option>
      <option value="270">Rotate 270&deg;</option>
    </select>
    <button class="btn" id="btnRotateSelected" title="Rotate only the checked pages">Rotate Selected</button>
    <button class="btn" id="btnRotateAll" title="Rotate every page">Rotate All</button>
    <button class="btn" id="btnClearSelection" title="Uncheck all pages">Clear Selection</button>
    <button class="btn danger" id="btnReset" title="Discard edits and reload the original file">Reset</button>
  </div>

  <div id="status"></div>

  <div id="emptyState">No PDF loaded yet.</div>
  <div id="thumbnailGrid"></div>

  <footer>Powered by pdf-lib &amp; PDF.js &mdash; no network requests, ever.</footer>

  <script src="lib/pdf.min.js"></script>
  <script src="lib/pdf-lib.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
